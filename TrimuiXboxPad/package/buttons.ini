# buttons.ini - boton fisico de la Trimui (indice SDL_Joystick) -> boton del mando HID.
# Se lee al arrancar la app: editalo en la SD y vuelve a abrir la app (no hay que recompilar).
# Nombres validos: A B X Y LB RB BACK START GUIDE LSTICK RSTICK NONE
#
# Mapa por defecto (medido en la consola con firmware JEB+):
b0 = B
b1 = A
b2 = Y
b3 = X
b4 = LB
b5 = RB
b6 = BACK
b7 = START
b8 = GUIDE
#
# Si un boton no hace lo que debe, mira en log.txt las lineas
# "boton fisico N pulsado -> ..." y corrige aqui el numero N.
